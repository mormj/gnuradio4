# Normally generated by the reviewer from user intent, GR4 project references and per-review Git/PR/build metadata.
# Internal provenance/correctness artifact, not a form the user must fill out.
# Advanced users may pre-populate it for offline or exact-snapshot reviews.
# Reviewer: use in a unique <superbuild>/.work/reviews/<run-id>/ directory; replace placeholders with sourced facts.
# This is a valid draft, not a ready contract. null means unresolved, not permission to guess.
schema_version: "0.2"
status: draft
review_id: review-001
framework_revision: "GR4 v0.2; record superbuild commit and .review content identity, including project/"
review_profile: maintainer
review_mode: fresh
target:
  repository: "<repository identity/location>"
  ref: null
  revision: null
  working_tree: "<clean, excluded local changes, or included patch digest>"
base:
  repository: "<repository identity/location>"
  ref: null
  revision: null
comparison_strategy:
  kind: merge_base_contribution
  rationale: "<why this comparison answers the requested review>"
  diff_base: null
  diff_target: null
  # Record change ID/URL, metadata source/time, declared base identity, parent evidence,
  # and destination/common ancestor/result/prior snapshots as relevant. Preserve declared
  # and selected bases separately if they differ. These are discovered, not user-required.
  details:
    change_url: null
    metadata_observed_at: null
    declared_base: null # repository/ref/revision from PR metadata
    intended_parent: null # same-repository parent identity and evidence, or explicitly none
    inherited_changes: [] # parent behavior excluded from this increment
    ultimate_destination: null # separately pinned destination
    integration_state: unknown # source integration, distinct from technical assessment
    integration_result: null # parents, result identity and resolutions only if constructed
    protected_checks: null # current rules/check state, or reason unavailable/not applicable
related_repositories: [] # id, repository, revision, relationship, artifact_identity, prerequisite
build_environment: {} # resolved GR4 project recipes/SDK/activation, configuration IDs, versions/artifacts, source references, limits
required_checks: [] # id, procedure (recipe ID or explicit check), expected_execution, environment, applicability, exemption
project_invariants: [] # id, statement, source, status (confirmed | inferred | unknown)
accepted_decisions: [] # decision IDs/sources and applicable scope
unknowns:
  - Resolve target/base and actual diff endpoints before changing status to ready.
  - Resolve dependency/artifact identities, applicable checks, invariants, and environment from GR4 references and the reviewed snapshots.
  - Derive existing task/host authority and a bounded plan; do not ask for already-discoverable facts or granted permissions.
out_of_scope: []
execution_permissions:
  run_checks: false
  isolated_probes: false
  production_edits: false
  publish: false
  approve: false
  commit: false
  push: false
  merge: false
  authority: "Unresolved draft; reviewer records actual task/host authority for local checks and probes. False defaults are not a new approval requirement."
budget:
  minutes: null
  timing_repetitions: null
  stop_rule: "Set a bounded plan; finalize when obligations are accounted for or the budget is reached, naming limitations."
